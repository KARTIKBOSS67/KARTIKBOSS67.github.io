<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFT07 | Official Minecraft Server</title>
    
    <style>
        /* Base Reset & Layout Alignment */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
            position: relative;
            background: #09070f;
        }

        /* Guaranteed Live Minecraft Landscape Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(15, 11, 31, 0.65), rgba(15, 11, 31, 0.85)), 
                        url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=2000') no-repeat center center/cover;
            filter: blur(10px);
            transform: scale(1.1);
            z-index: -2;
        }

        /* Purple Light Flare behind the UI */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(178, 81, 255, 0.25) 0%, transparent 60%);
            z-index: -1;
        }

        /* Perfect Glassmorphism Container */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 90%;
            max-width: 440px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        /* Logo Configuration */
        .logo-frame {
            position: relative;
            margin-bottom: 1.5rem;
            width: 140px;
            height: 140px;
        }

        .server-logo {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
            border: 3px solid #b251ff;
            box-shadow: 0 0 25px rgba(178, 81, 255, 0.6);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, #ffffff 40%, #d494ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-tag {
            font-size: 1.1rem;
            color: #d494ff;
            margin-bottom: 2.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.9;
        }

        /* Centered IP Showcase Copy Box */
        .ip-showcase {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(178, 81, 255, 0.2);
            border-radius: 16px;
            padding: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .ip-showcase:hover {
            background: rgba(0, 0, 0, 0.65);
            border-color: rgba(178, 81, 255, 0.6);
            box-shadow: 0 0 20px rgba(178, 81, 255, 0.25);
        }

        .ip-text-side {
            text-align: left;
        }

        .ip-meta {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #b3b3b3;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .ip-string {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* SVG Copy Icon Box alignment */
        .copy-badge {
            background: rgba(255, 255, 255, 0.08);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .ip-showcase:hover .copy-badge {
            background: #b251ff;
            transform: scale(1.05);
        }

        .copy-badge svg {
            width: 20px;
            height: 20px;
            fill: #d494ff;
            transition: fill 0.25s ease;
        }

        .ip-showcase:hover .copy-badge svg {
            fill: #ffffff;
        }

        /* Slide up Toast Banner Inside the Box */
        .toast-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #b251ff;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 1.1rem;
            transform: translateY(100%);
            transition: transform 0.25s ease;
        }

        .toast-banner.active {
            transform: translateY(0);
        }

        /* Built-in Purple Discord Action Link Button */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 1.15rem;
            background: linear-gradient(135deg, #5865F2 0%, #404eed 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.3);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .discord-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.5);
            filter: brightness(1.15);
        }

        .discord-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            h1 { font-size: 2.3rem; }
            .glass-card { padding: 2.5rem 1.5rem; }
            .logo-frame { width: 120px; height: 120px; }
            .ip-string { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="glass-card">
        <div class="logo-frame">
            <img src="https://kommodo.ai/i/8y6yiKFGp9AlI3Fp36dl" alt="CRAFT07 Logo" class="server-logo">
        </div>

        <h1>CRAFT07</h1>
        <p class="sub-tag">Join the Ultimate Realm</p>

        <div class="ip-showcase" onclick="copyAddress('play.craft07.com:25565')">
            <div class="ip-text-side">
                <p class="ip-meta">Server IP Address</p>
                <p class="ip-string">play.craft07.com:25565</p>
            </div>
            <div class="copy-badge">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </div>
            <div class="toast-banner" id="status-toast">
                IP Address Copied!
            </div>
        </div>

        <a href="https://discord.gg/GragT2Yecs" target="_blank" class="discord-btn">
            <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53a105.73,105.73,0,0,0,32,16.21,80.4,80.4,0,0,0,6.85-11.19,68.4,68.4,0,0,1-10.75-5.13c.91-.66,1.8-1.34,2.65-2a75.58,75.58,0,0,0,71.3,0c.85.69,1.74,1.37,2.65,2a68.4,68.4,0,0,1-10.75,5.13,80.4,80.4,0,0,0,6.85,11.19,105.73,105.73,0,0,0,32-16.21C130.66,47.55,124.5,24.73,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.88,46,53.79,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.12,46,96,53,91,65.69,84.69,65.69Z"/></svg>
            Join Discord
        </a>
    </div>

    <script>
        function copyAddress(textVal) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textVal).then(showToast).catch(fallbackCopy);
            } else {
                fallbackCopy(textVal);
            }
        }

        function fallbackCopy(textVal) {
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = textVal;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
            showToast();
        }

        function showToast() {
            const notice = document.getElementById('status-toast');
            notice.classList.add('active');
            setTimeout(() => {
                notice.classList.remove('active');
            }, 1800);
        }
    </script>
</body>
</html>
