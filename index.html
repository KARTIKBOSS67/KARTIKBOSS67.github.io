<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFT07 | Official Minecraft Server</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            /* FIX: Completely removes the glitchy blue square tap highlight on mobile screens */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            background: #09070f;
        }

        /* Fixed Background: High-Quality Minecraft Aesthetic */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(15, 11, 31, 0.65), rgba(15, 11, 31, 0.85)), 
                        url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=2000') no-repeat center center/cover;
            filter: blur(10px);
            transform: scale(1.1);
            z-index: -2;
        }

        /* Ambient Purple Glow (Main Theme) */
        .ambient-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(178, 81, 255, 0.25) 0%, transparent 60%);
            z-index: -1;
        }

        /* Premium Glassmorphic Container */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 3rem 2rem;
            width: 92%;
            max-width: 460px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        /* Server Logo Frame */
        .logo-frame {
            position: relative;
            margin-bottom: 1.5rem;
            width: 130px;
            height: 130px;
            border-radius: 24px;
            border: 3px solid #b251ff;
            box-shadow: 0 0 25px rgba(178, 81, 255, 0.6);
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }

        .server-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, #ffffff 40%, #d494ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-tag {
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            color: #d494ff;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Section Title Layout featuring custom blocks */
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #b3b3b3;
            align-self: flex-start;
            margin: 0.6rem 0 0.5rem 4px;
        }

        .block-emoji {
            width: 22px;
            height: 22px;
            object-fit: contain;
            border-radius: 4px;
        }

        /* Interactive Copy Box Elements */
        .ip-showcase {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .ip-showcase:hover {
            background: rgba(0, 0, 0, 0.65);
            border-color: rgba(178, 81, 255, 0.4);
            box-shadow: 0 0 20px rgba(178, 81, 255, 0.25);
        }

        .ip-text-side {
            text-align: left;
        }

        .ip-meta {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #aaa;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .ip-string {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        .copy-badge {
            background: rgba(255, 255, 255, 0.06);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .ip-showcase:hover .copy-badge {
            background: #b251ff;
        }

        .copy-badge svg {
            width: 18px;
            height: 18px;
            fill: #d494ff;
            transition: fill 0.25s ease;
        }

        .ip-showcase:hover .copy-badge svg {
            fill: #ffffff;
        }

        /* Neon Green Sliding Copy Success Animation Banner */
        .toast-banner {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #00ff88;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.05rem;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast-banner.active {
            transform: translateY(0);
        }

        /* Discord Button */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, #5865F2 0%, #404eed 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 1rem;
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.25);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .discord-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(88, 101, 242, 0.4);
            filter: brightness(1.1);
        }

        .discord-btn svg { width: 22px; height: 22px; fill: #ffffff; }

        @media (max-width: 480px) {
            h1 { font-size: 2.3rem; }
            .glass-card { padding: 2.5rem 1.25rem; }
            .logo-frame { width: 110px; height: 110px; }
        }
    </style>
</head>

    <script>
        function copyValue(textVal, toastId) {
            navigator.clipboard.writeText(textVal).then(() => {
                const targetToast = document.getElementById(toastId);
                targetToast.classList.add('active');
                setTimeout(() => { targetToast.classList.remove('active'); }, 1500);
            }).catch(() => {
                const hiddenArea = document.createElement("textarea");
                document.body.appendChild(hiddenArea);
                hiddenArea.value = textVal;
                hiddenArea.select();
                document.execCommand("copy");
                document.body.removeChild(hiddenArea);
                const targetToast = document.getElementById(toastId);
                targetToast.classList.add('active');
                setTimeout(() => { targetToast.classList.remove('active'); }, 1500);
            });
        }
    </script>
