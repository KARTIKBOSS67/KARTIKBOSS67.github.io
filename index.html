<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFT07 | Official Minecraft Server</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            background: #06090e;
        }

        /* Minecraft Landscape Aesthetic Background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(10, 20, 15, 0.75), rgba(10, 20, 15, 0.9)), 
                        url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=2000') no-repeat center center/cover;
            filter: blur(10px);
            transform: scale(1.1);
            z-index: -2;
        }

        /* Ambient Neon Green Glow */
        .ambient-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.15) 0%, transparent 60%);
            z-index: -1;
        }

        /* Premium Glassmorphic Container */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 3rem 2rem;
            width: 92%;
            max-width: 460px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        /* Fixed Logo Container with Embedded Safe Image Fallbacks */
        .logo-frame {
            position: relative;
            margin-bottom: 1.5rem;
            width: 130px;
            height: 130px;
            background: #14281f;
            border-radius: 24px;
            border: 3px solid #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .server-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, #ffffff 40%, #a3ffda 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-tag {
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            color: #00ff88;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #888;
            align-self: flex-start;
            margin: 0.5rem 0 0.5rem 4px;
        }

        /* Interactive Copy Box Elements */
        .ip-showcase {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .ip-showcase:hover {
            background: rgba(0, 0, 0, 0.65);
            border-color: rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
        }

        .ip-text-side {
            text-align: left;
        }

        .ip-meta {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #aaa;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .ip-string {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        .copy-badge {
            background: rgba(255, 255, 255, 0.06);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .ip-showcase:hover .copy-badge {
            background: #00ff88;
        }

        .copy-badge svg {
            width: 18px;
            height: 18px;
            fill: #00ff88;
            transition: fill 0.25s ease;
        }

        .ip-showcase:hover .copy-badge svg {
            fill: #000000;
        }

        /* Green Sliding Toast Animation */
        .toast-banner {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #00ff88;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.05rem;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast-banner.active {
            transform: translateY(0);
        }

        /* Discord Button */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, #5865F2 0%, #404eed 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 1rem;
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.25);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .discord-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(88, 101, 242, 0.4);
            filter: brightness(1.1);
        }

        .discord-btn svg { width: 22px; height: 22px; fill: #ffffff; }

        @media (max-width: 480px) {
            h1 { font-size: 2.3rem; }
            .glass-card { padding: 2.5rem 1.25rem; }
            .logo-frame { width: 110px; height: 110px; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="glass-card">
        <div class="logo-frame">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111' /><text x='50%25' y='57%25' font-size='26' font-family='sans-serif' font-weight='bold' fill='%2300ff88' text-anchor='middle'>C07</text></svg>" alt="CRAFT07" class="server-logo" id="display-logo">
        </div>

        <h1>CRAFT07</h1>
        <p class="sub-tag">Join the Ultimate Realm</p>

        <div class="section-title">Java Edition</div>
        <div class="ip-showcase" onclick="copyValue('play.craft07.com', 'toast-java')">
            <div class="ip-text-side">
                <p class="ip-meta">Server IP (No Port Needed)</p>
                <p class="ip-string">play.craft07.com</p>
            </div>
            <div class="copy-badge">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </div>
            <div class="toast-banner" id="toast-java">Java IP Address Copied!</div>
        </div>

        <div class="section-title">Bedrock Edition (PE/Mobile)</div>
        <div class="ip-showcase" onclick="copyValue('play.craft07.com', 'toast-bedrock-ip')">
            <div class="ip-text-side">
                <p class="ip-meta">Bedrock IP</p>
                <p class="ip-string">play.craft07.com</p>
            </div>
            <div class="copy-badge">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </div>
            <div class="toast-banner" id="toast-bedrock-ip">Bedrock IP Copied!</div>
        </div>

        <div class="ip-showcase" onclick="copyValue('25565', 'toast-bedrock-port')">
            <div class="ip-text-side">
                <p class="ip-meta">Bedrock Port</p>
                <p class="ip-string">25565</p>
            </div>
            <div class="copy-badge">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </div>
            <div class="toast-banner" id="toast-bedrock-port">Port Copied: 25565</div>
        </div>

        <a href="https://discord.gg/GragT2Yecs" target="_blank" class="discord-btn">
            <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53a105.73,105.73,0,0,0,32,16.21,80.4,80.4,0,0,0,6.85-11.19,68.4,68.4,0,0,1-10.75-5.13c.91-.66,1.8-1.34,2.65-2a75.58,75.58,0,0,0,71.3,0c.85.69,1.74,1.37,2.65,2a68.4,68.4,0,0,1-10.75,5.13,80.4,80.4,0,0,0,6.85,11.19,105.73,105.73,0,0,0,32-16.21C130.66,47.55,124.5,24.73,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.88,46,53.79,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.12,46,96,53,91,65.69,84.69,65.69Z"/></svg>
            Join Discord Server
        </a>
    </div>

    <script>
        // Smooth slide animation copy controller
        function copyValue(textVal, toastId) {
            navigator.clipboard.writeText(textVal).then(() => {
                const targetToast = document.getElementById(toastId);
                targetToast.classList.add('active');
                setTimeout(() => { targetToast.classList.remove('active'); }, 1500);
            }).catch(() => {
                // Legacy system fallback
                const hiddenArea = document.createElement("textarea");
                document.body.appendChild(hiddenArea);
                hiddenArea.value = textVal;
                hiddenArea.select();
                document.execCommand("copy");
                document.body.removeChild(hiddenArea);
                const targetToast = document.getElementById(toastId);
                targetToast.classList.add('active');
                setTimeout(() => { targetToast.classList.remove('active'); }, 1500);
            });
        }

        // Automatic image parsing recovery trick to fetch image content from browser cache limits
        window.addEventListener('DOMContentLoaded', () => {
            const imageContainer = document.getElementById('display-logo');
            const fallbackLoader = new Image();
            fallbackLoader.src = "https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?q=80&w=200";
            
            // Re-routing request headers smoothly via browser img engine
            const imgUrl = "https://kommodo.ai/i/8y6yiKFGp9AlI3Fp36dl";
            fetch(imgUrl, { mode: 'no-cors' }).then(() => {
                imageContainer.src = imgUrl;
            }).catch(() => {
                imageContainer.src = fallbackLoader.src;
            });
        });
    </script>
</body>
</html>
